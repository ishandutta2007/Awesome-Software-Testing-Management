<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Vibrant Accent Gradients for Dynamic Elements -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-300px); }
    }
    .pulse-bg { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .floating { animation: floatParticle 8s ease-in-out infinite; transform-origin: center; }
    .animated-line { stroke-dasharray: 8 8; animation: dashMove 2s linear infinite; }
    .wave-line { animation: waveMove 10s linear infinite; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>

  <!-- Background Decorative Glowing Orbs (Behind Foreground) -->
  <circle cx="150" cy="90" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)" class="pulse-bg" />
  <circle cx="1050" cy="270" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" class="pulse-bg" style="animation-delay: -3s;" />

  <!-- Background Animated Data Stream Wave Lines -->
  <path d="M -100 280 Q 200 220 500 290 T 1100 240 T 1400 300" fill="none" stroke="url(#accentCyan)" stroke-width="2" opacity="0.3" class="animated-line" />
  <path d="M -100 310 Q 300 250 700 320 T 1300 270" fill="none" stroke="url(#accentPurple)" stroke-width="2" opacity="0.25" class="animated-line" style="animation-duration: 3s;" />

  <!-- Dynamic Side Graphic Badges / UI Tech Flow Indicators (Positioned safely at sides/bottom) -->
  <!-- Top Right Tech Status Cards -->
  <g transform="translate(860, 40)" filter="url(#cardShadow)" class="floating">
    <rect width="280" height="64" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="32" r="14" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="35" cy="32" r="6" fill="#10b981"/>
    <text x="62" y="29" class="badge-text" font-size="14" font-weight="700">Test Execution Tracking</text>
    <text x="62" y="47" class="badge-text" font-size="12" fill="#64748b">Real-time QA Analytics</text>
  </g>

  <g transform="translate(890, 120)" filter="url(#cardShadow)" class="floating" style="animation-delay: -2s;">
    <rect width="250" height="64" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="32" r="14" fill="#3b82f6" fill-opacity="0.2"/>
    <polygon points="35,24 42,36 28,36" fill="#3b82f6"/>
    <text x="62" y="29" class="badge-text" font-size="14" font-weight="700">Open-Source & SaaS</text>
    <text x="62" y="47" class="badge-text" font-size="12" fill="#64748b">Curated QA Ecosystem</text>
  </g>

  <g transform="translate(860, 200)" filter="url(#cardShadow)" class="floating" style="animation-delay: -4s;">
    <rect width="280" height="64" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="32" r="14" fill="#a855f7" fill-opacity="0.2"/>
    <rect x="28" y="25" width="14" height="14" rx="3" fill="#a855f7"/>
    <text x="62" y="29" class="badge-text" font-size="14" font-weight="700">Traceability & Metrics</text>
    <text x="62" y="47" class="badge-text" font-size="12" fill="#64748b">End-to-End Test Suite</text>
  </g>

  <!-- Left Side Floating Dynamic Pill Tag -->
  <g transform="translate(80, 50)" class="floating" style="animation-delay: -1s;">
    <rect width="210" height="34" rx="17" fill="url(#accentCyan)" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
    <text x="105" y="22" text-anchor="middle" class="badge-text" fill="#38bdf8">🧪 CURATED QA ECOSYSTEM</text>
  </g>

  <!-- MAIN FOREGROUND TEXT (CLEAR & UNBLOCKABLE) -->
  <g transform="translate(80, 145)">
    <!-- Main Title with Gradient Accent Bar -->
    <rect x="0" y="-35" width="8" height="70" rx="4" fill="url(#accentPurple)" />
    <text x="28" y="-2" class="title-text" font-size="40" letter-spacing="-0.5">Awesome Software Testing</text>
    <text x="28" y="42" class="title-text" font-size="40" fill="url(#accentCyan)" letter-spacing="-0.5">Management 🚀</text>

    <!-- Subtitle -->
    <text x="28" y="85" class="subtitle-text" font-size="18">
      Top SaaS Platforms &amp; Open-Source Projects for QA Teams, Test Tracking &amp; Metrics
    </text>
  </g>

  <!-- Bottom Interactive Tech Tags Row -->
  <g transform="translate(80, 295)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="65" y="19" text-anchor="middle" class="badge-text" font-size="12">⚡ Test Suites</text>

    <!-- Pill 2 -->
    <rect x="142" y="0" width="140" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="212" y="19" text-anchor="middle" class="badge-text" font-size="12">📊 QA Reporting</text>

    <!-- Pill 3 -->
    <rect x="294" y="0" width="150" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="369" y="19" text-anchor="middle" class="badge-text" font-size="12">🔗 Jira &amp; CI/CD Integrations</text>
  </g>
</svg>
